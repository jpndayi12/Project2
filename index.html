
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acme Inc - Admin Dashboard</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
        }

        .sidebar {
            width: 164px;
            min-height: 100vh;
        }

        .menu-item.active {
            background-color: #f3f4f6;
            color: #111827;
        }

        .menu-item {
            transition: all 0.2s ease;
        }

        @media (max-width: 640px) {
            .sidebar {
                width: 65px;
            }

            .sidebar .menu-text,
            .sidebar .brand-name {
                display: none;
            }
        }
    </style>
</head>

<body class="text-gray-800">

    <div class="flex min-h-screen">

        <!-- SIDEBAR -->
        <aside class="sidebar border-r border-gray-200 bg-white px-3 py-4">

            <!-- Logo -->
            <div class="flex items-center gap-2 mb-7 px-1">
                <i data-lucide="building-2"
                   class="w-4 h-4 text-gray-700"></i>

                <span class="brand-name text-sm font-semibold">
                    My first Page
                </span>
            </div>

            <!-- Navigation -->
            <nav class="space-y-1">

                <a href="#dashboard"
                   class="menu-item active flex items-center gap-2 rounded-md px-2 py-2 text-xs text-gray-600"
                   onclick="showPage('Dashboard', this)">
                    <i data-lucide="layout-dashboard" class="w-3.5 h-3.5"></i>
                    <span class="menu-text">Dashboard</span>
                </a>

                <a href="#users"
                   class="menu-item flex items-center gap-2 rounded-md px-2 py-2 text-xs text-gray-600"
                   onclick="showPage('Users', this)">
                    <i data-lucide="users" class="w-3.5 h-3.5"></i>
                    <span class="menu-text">Users</span>
                </a>

                <a href="#orders"
                   class="menu-item flex items-center gap-2 rounded-md px-2 py-2 text-xs text-gray-600"
                   onclick="showPage('Orders', this)">
                    <i data-lucide="shopping-cart" class="w-3.5 h-3.5"></i>
                    <span class="menu-text">Orders</span>
                </a>

                <a href="#reports"
                   class="menu-item flex items-center gap-2 rounded-md px-2 py-2 text-xs text-gray-600"
                   onclick="showPage('Reports', this)">
                    <i data-lucide="chart-bar" class="w-3.5 h-3.5"></i>
                    <span class="menu-text">Reports</span>
                </a>

            </nav>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="flex-1 min-w-0 bg-white px-4 py-4 sm:px-5">

            <!-- Page Heading -->
            <div class="mb-5">
                <h1 id="page-title"
                    class="text-xl font-semibold text-gray-800">
                    Dashboard
                </h1>
            </div>


            <!-- DASHBOARD CONTENT -->
            <div id="dashboard-content">

                <!-- SUMMARY CARDS -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6">

                    <!-- Total Users -->
                    <div class="border border-gray-100 rounded-lg shadow-sm
                                px-4 py-4 text-center">

                        <h2 class="text-2xl font-semibold text-gray-900">
                            125
                        </h2>

                        <p class="text-xs text-gray-400 mt-1">
                            Total Users
                        </p>

                    </div>


                    <!-- Total Orders -->
                    <div class="border border-gray-100 rounded-lg shadow-sm
                                px-4 py-4 text-center">

                        <h2 class="text-2xl font-semibold text-gray-900">
                            85
                        </h2>

                        <p class="text-xs text-gray-400 mt-1">
                            Total Orders
                        </p>

                    </div>


                    <!-- Active Users -->
                    <div class="border border-gray-100 rounded-lg shadow-sm
                                px-4 py-4 text-center">

                        <h2 class="text-2xl font-semibold text-gray-900">
                            53
                        </h2>

                        <p class="text-xs text-gray-400 mt-1">
                            Active Users
                        </p>

                    </div>

                </div>


                <!-- RECENT ORDERS TABLE -->
                <div class="w-full overflow-x-auto">

                    <table class="w-full text-left text-xs">

                        <!-- Table Header -->
                        <thead>
                            <tr class="border-b border-gray-200 text-gray-500">

                                <th class="py-3 px-2 font-medium">
                                    Order ID
                                </th>

                                <th class="py-3 px-2 font-medium">
                                    User ID
                                </th>

                                <th class="py-3 px-2 font-medium">
                                    Status
                                </th>

                                <th class="py-3 px-2 font-medium">
                                    Total
                                </th>

                            </tr>
                        </thead>


                        <!-- Table Body -->
                        <tbody class="text-gray-700">

                            <tr class="border-b border-gray-100">
                                <td class="py-3 px-2">ORD001</td>
                                <td class="py-3 px-2">USR001</td>
                                <td class="py-3 px-2">Paid</td>
                                <td class="py-3 px-2">$250.00</td>
                            </tr>

                            <tr class="border-b border-gray-100">
                                <td class="py-3 px-2">ORD002</td>
                                <td class="py-3 px-2">USR002</td>
                                <td class="py-3 px-2">Pending</td>
                                <td class="py-3 px-2">$150.00</td>
                            </tr>

                            <tr class="border-b border-gray-100">
                                <td class="py-3 px-2">ORD003</td>
                                <td class="py-3 px-2">USR003</td>
                                <td class="py-3 px-2">Unpaid</td>
                                <td class="py-3 px-2">$350.00</td>
                            </tr>

                        </tbody>

                    </table>

                </div>


                <!-- RECENT ORDERS LABEL -->
                <div class="text-center mt-4">

                    <p class="text-xs text-gray-400">
                        Recent Orders
                    </p>

                </div>

            </div>

        </main>

    </div>


    <!-- JAVASCRIPT -->
    <script>

        // Initialize Lucide icons
        lucide.createIcons();

        // Sidebar navigation
        function showPage(page, element) {

            // Update page title
            document.getElementById("page-title").textContent = page;

            // Remove active class from all menu items
            document.querySelectorAll(".menu-item").forEach(item => {
                item.classList.remove("active");
            });

            // Add active class to selected menu
            element.classList.add("active");

            // Dashboard content visibility
            const content = document.getElementById("dashboard-content");

            if (page === "Dashboard") {
                content.style.display = "block";
            } else {
                content.style.display = "none";
            }

        }

    </script>

</body>
</html>
